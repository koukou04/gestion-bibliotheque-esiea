# =====================================
# PROFIL PAR DÉFAUT - DÉVELOPPEMENT LOCAL
# =====================================

# Profil actif (default par défaut, production sur Render)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

spring.application.name=gestion-bibliotheque

# Database Configuration
# En production (Render), les variables d'environnement écraseront ces valeurs
# Note: DATABASE_URL de Render doit être transformé en ajoutant le préfixe jdbc:
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:bibliotheque}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

# H2 Console (uniquement pour développement local)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# JPA
spring.jpa.database-platform=${DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Kafka Configuration
# NOTE: Kafka est optionnel. L'application démarrera même si Kafka n'est pas disponible.
# Pour activer Kafka, installez-le et démarrez-le sur localhost:9092 puis mettez:
# spring.kafka.enabled=true
spring.kafka.enabled=${SPRING_KAFKA_ENABLED:true}
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=bibliotheque-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Configuration pour éviter les erreurs au démarrage si Kafka n'est pas disponible
spring.kafka.producer.properties.max.block.ms=3000